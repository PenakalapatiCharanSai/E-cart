<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartCart{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .nav-link { font-weight: 500; font-size: 0.95rem; color: var(--text-main); }
        .nav-link:hover { color: var(--primary-hover); text-decoration: none; }
        .nav-link::after { display: none !important; }
        .nav-link.text-danger { color: #e53e3e; }
        .nav-link.text-danger:hover { color: #c53030; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    </style>
</head>
<body>
    <header>
        <a href="/" style="text-decoration: none; color: inherit; display: inline-block;">
            <h1><i class="fas fa-shopping-cart" style="margin-right: 12px; animation: float 3s ease-in-out infinite; display: inline-block;"></i>SmartCart Admin Portal</h1>
        </a>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="#" class="nav-link"><i class="fas fa-info-circle"></i> About</a>
            <a href="#" class="nav-link"><i class="fas fa-envelope"></i> Contact</a>
            {% if session.get('admin_id') %}
                <a href="/admin-dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="/admin/orders" class="nav-link"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="/admin-logout" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
            {% else %}
                <a href="/admin-login" class="nav-link"><i class="fas fa-sign-in-alt"></i> Login</a>
                <a href="/admin-signup" class="nav-link"><i class="fas fa-user-plus"></i> Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <p>&copy; 2026 SmartCart. All rights reserved.</p>
    </footer>
</body>
</html>
