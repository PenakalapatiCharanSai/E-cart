{% extends 'base.html' %}

{% block title %}Admin Sign In - SmartCart{% endblock %}

{% block content %}

<div class="form-card" style="max-width: 440px; margin: 40px auto;">
    <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 36px; color: var(--admin-primary); margin-bottom: 8px;">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main); margin: 0;">Admin Portal Access</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Sign in with store manager credentials</p>
    </div>

    <form method="POST" action="/admin-login">
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" name="email" placeholder="admin@smartcart.com" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn-admin btn-admin-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 10px;">
            <i class="fas fa-sign-in-alt"></i> Sign In to Admin Panel
        </button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">
        Need an admin account? <a href="/admin-signup" style="color: var(--admin-primary); font-weight: 700; text-decoration: none;">Register Admin</a>
    </div>
</div>

{% endblock %}
