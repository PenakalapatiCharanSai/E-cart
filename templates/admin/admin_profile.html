{% extends 'base.html' %}

{% block title %}Admin Profile - SmartCart{% endblock %}

{% block content %}

<div class="form-card">
    <div style="margin-bottom: 24px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
        <div style="position: relative; display: inline-block; margin-bottom: 12px;">
            {% if admin.profile_image %}
                <img src="/static/uploads/admin_profiles/{{ admin.profile_image }}" alt="{{ admin.name }}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--admin-primary); box-shadow: var(--shadow-sm);">
            {% else %}
                <div style="width: 100px; height: 100px; border-radius: 50%; background: #eef2ff; color: var(--admin-primary); display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid var(--admin-primary); margin: 0 auto;">
                    <i class="fas fa-user-shield"></i>
                </div>
            {% endif %}
        </div>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main); margin: 0;">{{ admin.name }}</h2>
        <p style="color: var(--text-muted); font-size: 13px;">Store Administrator Profile</p>
    </div>

    <form method="POST" action="/admin/profile" enctype="multipart/form-data">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Administrator Name</label>
            <input type="text" name="name" value="{{ admin.name }}" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" name="email" value="{{ admin.email }}" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> Update Password (optional)</label>
            <input type="password" name="password" placeholder="Leave blank to keep current password">
        </div>

        <div class="form-group">
            <label><i class="fas fa-camera"></i> Change Profile Photo (optional)</label>
            <input type="file" name="profile_image" accept="image/*">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn-admin btn-admin-primary" style="flex: 1; padding: 12px;">
                <i class="fas fa-sync-alt"></i> Update Profile
            </button>
            <a href="/admin-dashboard" class="btn-admin btn-admin-secondary">
                Dashboard
            </a>
        </div>
    </form>
</div>

{% endblock %}
