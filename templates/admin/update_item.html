{% extends 'base.html' %}
{% block title %}Update Product{% endblock %}
{% block content %}

<div class="form-card" style="max-width: 600px;">
    <h2><i class="fas fa-edit"></i> Update Product</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p style="color:green;"><i class="fas fa-check-circle"></i> {{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/admin/update-item/{{ product.product_id }}" enctype="multipart/form-data">
        <div class="form-group">
            <label><i class="fas fa-tag"></i> Product Name</label>
            <input type="text" name="name" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-align-left"></i> Description</label>
            <textarea name="description" rows="3" required>{{ product.description }}</textarea>
        </div>
        <div class="form-group">
            <label><i class="fas fa-list"></i> Category</label>
            <input type="text" name="category" value="{{ product.category }}" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-rupee-sign"></i> Price</label>
            <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-boxes"></i> Stock Quantity</label>
            <input type="number" name="quantity" value="{{ product.quantity }}" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-image"></i> Old Image</label><br>
            <img src="/static/uploads/product_images/{{ product.image }}" width="120" style="margin-bottom: 10px; border-radius: 8px;">
        </div>
        <div class="form-group">
            <label><i class="fas fa-upload"></i> Choose New Image (Optional)</label>
            <input type="file" name="image" accept="image/*">
        </div>

        <button type="submit" style="width: 100%; margin-top: 15px;"><i class="fas fa-save"></i> Update Product</button>
    </form>

    <div class="mt-4 text-center">
        <a href="/admin/item-list"><i class="fas fa-arrow-left"></i> Back to Product List</a>
    </div>
</div>
{% endblock %}
