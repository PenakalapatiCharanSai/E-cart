{% extends 'base.html' %}
{% block title %}Verify OTP{% endblock %}
{% block content %}
<div class="form-card">
    <h2><i class="fas fa-key"></i> Verify OTP</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p style="color:red;"><i class="fas fa-exclamation-circle"></i> {{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/verify-otp">
        <div class="form-group">
            <label><i class="fas fa-hashtag"></i> Enter OTP</label>
            <input type="text" name="otp" placeholder="Enter the OTP sent to your email" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> Create Password</label>
            <input type="password" name="password" placeholder="New Password" required>
        </div>

        <button type="submit" style="width: 100%; margin-top: 10px;"><i class="fas fa-check-circle"></i> Verify & Register</button>
    </form>
</div>
{% endblock %}
