{% extends 'base.html' %}

{% block title %}Add New Product - SmartCart Admin{% endblock %}

{% block content %}

<div class="form-card">
    <div style="margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 14px;">
        <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main); margin: 0;">
            <i class="fas fa-plus-circle" style="color: var(--admin-primary);"></i> Add New Product to Catalog
        </h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Fill in details to list a new item on the storefront</p>
    </div>

    <form method="POST" action="/admin/add-item" enctype="multipart/form-data">
        <div class="form-group">
            <label><i class="fas fa-tag"></i> Product Name</label>
            <input type="text" name="name" placeholder="e.g. Wireless Noise Cancelling Headphones" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
                <label><i class="fas fa-list"></i> Category</label>
                <input type="text" name="category" placeholder="e.g. Electronics" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-rupee-sign"></i> Price (₹)</label>
                <input type="number" step="0.01" name="price" placeholder="1499.00" required>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-boxes"></i> Stock Quantity</label>
            <input type="number" name="quantity" value="50" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-align-left"></i> Product Description</label>
            <textarea name="description" rows="4" placeholder="Enter key features, specifications, and warranty information..." required></textarea>
        </div>

        <div class="form-group">
            <label><i class="fas fa-image"></i> Product Image</label>
            <input type="file" name="image" accept="image/*" required style="padding: 8px;">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn-admin btn-admin-primary" style="flex: 1; padding: 12px;">
                <i class="fas fa-save"></i> Save Product
            </button>
            <a href="/admin/item-list" class="btn-admin btn-admin-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
