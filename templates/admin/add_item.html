{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}

<div class="form-card" style="max-width: 600px;">
    <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p style="color:green;"><i class="fas fa-check-circle"></i> {{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/admin/add-item" enctype="multipart/form-data">
        <div class="form-group">
            <label><i class="fas fa-tag"></i> Product Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-align-left"></i> Description</label>
            <textarea name="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label><i class="fas fa-list"></i> Category</label>
            <input type="text" name="category" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-rupee-sign"></i> Price</label>
            <input type="number" step="0.01" name="price" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-boxes"></i> Stock Quantity</label>
            <input type="number" name="quantity" value="50" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-image"></i> Product Image</label>
            <input type="file" name="image" accept="image/*" required>
        </div>

        <button type="submit" style="width: 100%; margin-top: 15px;"><i class="fas fa-save"></i> Add Product</button>
    </form>

    <div class="mt-4 text-center">
        <a href="/admin-dashboard"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
{% endblock %}
