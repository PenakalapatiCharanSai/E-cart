{% extends 'base.html' %}

{% block title %}Admin Registration - SmartCart{% endblock %}

{% block content %}

<div class="form-card" style="max-width: 420px; width: 92%; margin: 24px auto; padding: 28px 24px;">
    
    <!-- Mode Toggle Switcher -->
    <div style="display: flex; background: #f1f5f9; padding: 4px; border-radius: 30px; margin-bottom: 24px;">
        <a href="/admin-login" style="flex: 1; text-align: center; padding: 8px 12px; font-size: 13px; font-weight: 700; border-radius: 20px; text-decoration: none; color: var(--text-muted);">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </a>
        <a href="/admin-signup" style="flex: 1; text-align: center; padding: 8px 12px; font-size: 13px; font-weight: 700; border-radius: 20px; text-decoration: none; background: #ffffff; color: var(--admin-primary); box-shadow: var(--shadow-sm);">
            <i class="fas fa-user-plus"></i> Register
        </a>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 32px; color: var(--admin-primary); margin-bottom: 6px;">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2 style="font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0;">Register New Administrator</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Enter details to receive verification OTP via email</p>
    </div>

    <form method="POST" action="/admin-signup">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Full Name</label>
            <input type="text" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" name="email" placeholder="admin@example.com" required>
        </div>

        <button type="submit" class="btn-admin btn-admin-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 6px;">
            <i class="fas fa-paper-plane"></i> Send Verification OTP
        </button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-muted);">
        Already registered? <a href="/admin-login" style="color: var(--admin-primary); font-weight: 700; text-decoration: none;">Sign In</a>
    </div>
</div>

{% endblock %}
