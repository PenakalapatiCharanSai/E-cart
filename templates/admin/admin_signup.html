{% extends 'base.html' %}
{% block title %}Admin Signup{% endblock %}
{% block content %}
<div class="form-card">
    <h2><i class="fas fa-user-plus"></i> Admin Registration</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p style="color:red;"><i class="fas fa-exclamation-circle"></i> {{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/admin-signup">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Name</label>
            <input type="text" name="name" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <button type="submit" style="width: 100%; margin-top: 10px;"><i class="fas fa-paper-plane"></i> Send OTP</button>
    </form>
</div>
{% endblock %}
