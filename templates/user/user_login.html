{% extends 'user_base.html' %}

{% block title %}Sign In - SmartCart{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <div style="font-size: 28px; font-weight: 800; color: var(--brand-blue); margin-bottom: 8px;">
            <i class="fas fa-shopping-bag"></i> Smart<span>Cart</span>
        </div>
        <h2>Sign In to Your Account</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Enter your registered credentials to complete purchases</p>
    </div>

    <form method="POST" action="/user-login">
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-buy-now" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 10px;">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 13px; border-top: 1px solid var(--border-light); padding-top: 18px; color: var(--text-muted);">
        New to SmartCart? <a href="/user-register" style="color: var(--brand-blue); font-weight: 700; text-decoration: none;">Create an Account</a>
    </div>
</div>
{% endblock %}
