{% extends 'user_base.html' %}

{% block title %}Complete Payment{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 500px;">
    <h2>Complete Your Payment</h2>
    <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
    
    <div style="font-size: 18px; margin-bottom: 30px;">
        Total Amount Due: <br>
        <span style="font-size: 32px; font-weight: 700; color: #b12704;">₹{{ amount }}</span>
    </div>

    <button id="rzp-button" class="btn btn-block" style="font-size: 18px; padding: 15px;"><i class="fas fa-lock"></i> Pay Securely with Razorpay</button>
</div>

<!-- Razorpay Checkout Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "{{ key_id }}",
    "amount": "{{ amount * 100 }}",  // in paise
    "currency": "INR",
    "name": "SmartCart",
    "description": "Order Payment",
    "order_id": "{{ order_id }}",
    "handler": function (response){
        // Build a small form and POST to server for verification
        var form = document.createElement("form");
        form.method = "POST";
        form.action = "/verify-payment";

        var fields = {
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_order_id: response.razorpay_order_id,
            razorpay_signature: response.razorpay_signature
        };

        for (var name in fields) {
            var input = document.createElement("input");
            input.type = "hidden";
            input.name = name;
            input.value = fields[name];
            form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();
    },
};

var rzp = new Razorpay(options);

document.getElementById('rzp-button').onclick = function(e){
    rzp.open();
    e.preventDefault();
}
</script>
{% endblock %}
